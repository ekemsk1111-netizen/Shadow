        <button onclick="showPage('settings')">⚙️ 설정</button>

<div class="main">

    <!-- 대시보드 -->

            <div class="card">

        </div>

    </div>

    <!-- 조직원 -->

        <h1>조직원 관리</h1>

        <table>
            <tr>
                <th>닉네임</th>
                <th>직급</th>
                <th>활동횟수</th>
                <th>경고</th>

            <tr>
                <td>CHEESE</td>

            </tr>

            <tr>
                <td>홍길동</td>
                <td>부장</td>
                <td>0</td>
                <td>0</td>
            </tr>
        </table>

    </div>

    <!-- 자금 -->
    <div id="money" class="page">

        <h1>자금 관리</h1>

        <table>
            <tr>
                <th>날짜</th>
                <th>내용</th>

            </tr>

            <tr>
                <td>2026-06-06</td>
                <td>조직 수익</td>
                <td>₩0</td>
            </tr>
        </table>

    </div>

    <!-- 보고서 -->
    <div id="reports" class="page">

        <h1>보고서</h1>

        <table>
            <tr>
                <th>작성자</th>
                <th>제목</th>

            <tr>

    <!-- 설정 -->
    <div id="settings" class="page">

        <h1>설정</h1>

        <p>관리자 설정 페이지</p>

    </div>

</div>

<script>
function showPage(pageId){

    const pages = document.querySelectorAll('.page');

    pages.forEach(page=>{
        page.classList.remove('active');
    });

    document.getElementById(pageId).classList.add('active');
}
</script>

</body>
</html>
